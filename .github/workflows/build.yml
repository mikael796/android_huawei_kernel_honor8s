name: Build Kernel

on:
  workflow_dispatch:

env:
  DEFCONFIG: honor8s_user_defconfig
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y make bc libssl-dev flex bison libncurses-dev cpio
        sudo apt-get install -y gcc-9-aarch64-linux-gnu gcc-10-aarch64-linux-gnu
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/local/bin/aarch64-linux-gnu-gcc
        sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-9 /usr/local/bin/aarch64-linux-gnu-g++
        echo "deb [trusted=yes] http://archive.ubuntu.com/ubuntu focal main universe" | sudo tee /etc/apt/sources.list.d/focal.list
        sudo apt-get update
        sudo apt-get install -y python2
        sudo ln -sf /usr/bin/python2 /usr/local/bin/python
        python --version
        aarch64-linux-gnu-gcc --version | head -1

    - name: Build kernel
      id: build
      run: |
        # gcc>=10 defaults to -fno-common; 4.9-era dtc breaks (yylloc multiple definition)
        echo 'HOSTCFLAGS += -fcommon' >> Makefile
        # MTK sprinkles -Werror into subdir Makefiles (ccflags-y), overriding global flags
        # NOTE: include filters MUST come before -- or grep treats them as file operands
        # and recurses over ALL files (would strip -Werror from scripts/Kbuild.include
        # which legitimately needs it for cc-option compiler tests)
        # sed targets ONLY standalone -Werror (followed by space/backslash/EOL),
        # NOT -Werror=foo or -Werror-foo diagnostics flags in root Makefile
        grep -rl --include="Makefile" --include="Kbuild" -- -Werror . 2>/dev/null | xargs -r sed -E -i 's/-Werror([[:space:]\]|$)/\1/g'
        echo "standalone -Werror remaining: $(grep -rl --include=Makefile --include=Kbuild -E -- '-Werror([[:space:]]|$)' . 2>/dev/null | wc -l) files (should be 0)"
        grep -q -- '-Werror $(KBUILD_CPPFLAGS)' scripts/Kbuild.include && echo "Kbuild.include intact" || echo "WARNING: Kbuild.include damaged"
        grep -q -- 'cc-option,-Werror=implicit-int' Makefile && echo "root Makefile intact" || echo "WARNING: root Makefile damaged"
        # old gcc didn't know -Werror=incompatible-pointer-types so cc-option dropped it;
        # gcc-9 knows it -> MTK code full of pointer type mismatches (blk-cgroup, tfa98xx) -> build dies.
        # remove that one flag, keep implicit-int/strict-prototypes/date-time
        sed -i '/cc-option,-Werror=incompatible-pointer-types/d' Makefile
        grep -q -- 'incompatible-pointer-types' Makefile && echo "WARNING: still present" || echo "incompatible-pointer-types flag removed"
        # MTK bug in stat.c: uses idle_time/iowait_time where idle_usecs/iowait_usecs declared
        sed -i 's/idle_time = get_cpu_idle_time_us_wo_cpuoffline/idle_usecs = get_cpu_idle_time_us_wo_cpuoffline/' fs/proc/stat.c
        sed -i 's/iowait_time = get_cpu_iowait_time_us_wo_cpuoffline/iowait_usecs = get_cpu_iowait_time_us_wo_cpuoffline/' fs/proc/stat.c
        grep -n "wo_cpuoffline" fs/proc/stat.c
        mkdir -p out
        make O=out ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} python=python2 ${DEFCONFIG}
        set -o pipefail
        make O=out ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} python=python2 -j$(nproc) 2>&1 | tee build.log | tail -20
        echo "=== build exit ok ==="

    - name: Show errors if any
      if: failure() || steps.build.outcome == 'failure'
      run: |
        if [ -f build.log ]; then
          grep -n -B2 -A8 -iE "error:|error 1|error 2|\*\*\*.*Error" build.log | head -80 || echo "no error lines found"
          echo "=== last 30 lines ==="
          tail -30 build.log
        fi

    - name: Check artifacts
      run: |
        ls -la out/arch/arm64/boot/ || true
        test -f out/arch/arm64/boot/Image.gz-dtb && echo "Image.gz-dtb OK" || echo "MISSING Image.gz-dtb"
        test -f out/arch/arm64/boot/Image.gz-dtb || exit 1

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-honor8s-4.9.135
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: out/arch/arm64/boot/Image.gz-dtb
        name: Honor 8S Kernel 4.9.135
        tag_name: kernel-${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
