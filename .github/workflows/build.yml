name: Build Kernel

on:
  workflow_dispatch:

env:
  DEFCONFIG: merge_full_k61v1_64_mex_a32_defconfig
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu make bc libssl-dev flex bison libncurses-dev cpio
        echo "deb [trusted=yes] http://archive.ubuntu.com/ubuntu focal main universe" | sudo tee /etc/apt/sources.list.d/focal.list
        sudo apt-get update
        sudo apt-get install -y python2
        sudo ln -sf /usr/bin/python2 /usr/local/bin/python
        python --version

    - name: Build kernel
      run: |
        mkdir -p out
        make O=out ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} python=python2 ${DEFCONFIG}
        make O=out ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} python=python2 -j$(nproc) 2>&1 | tail -50

    - name: Check artifacts
      run: |
        ls -la out/arch/arm64/boot/ || true
        test -f out/arch/arm64/boot/Image.gz-dtb && echo "Image.gz-dtb OK" || echo "MISSING Image.gz-dtb"
        test -f out/arch/arm64/boot/Image.gz-dtb || exit 1

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-honor8s-4.9.135
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: out/arch/arm64/boot/Image.gz-dtb
        name: Honor 8S Kernel 4.9.135
        tag_name: kernel-${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
